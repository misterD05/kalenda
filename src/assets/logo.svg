<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sfondo principale: gradiente profondo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Gradiente accento vivace (Indigo-Purple) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Gradiente corpo del calendario -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Effetto bagliore (Glow) per il giorno attivo -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Ombra principale dell'icona -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Sfondo Icona App -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#312e81" stroke-width="3" filter="url(#shadow)" />

  <!-- Corpo principale del Calendario -->
  <rect x="80" y="80" width="352" height="352" rx="40" fill="url(#cardGrad)" stroke="#334155" stroke-width="3" />

  <!-- Header della griglia (barra superiore del mese) disegnato con matematica perfetta -->
  <path d="M 80 160 L 80 120 A 40 40 0 0 1 120 80 L 392 80 A 40 40 0 0 1 432 120 L 432 160 Z" fill="#312e81" opacity="0.4" />
  <line x1="80" y1="160" x2="432" y2="160" stroke="#334155" stroke-width="2" />

  <!-- Piccoli indicatori nei giorni della settimana (perfettamente allineati al centro delle colonne sotto) -->
  <circle cx="136" cy="120" r="5" fill="#818cf8" opacity="0.6"/>
  <circle cx="196" cy="120" r="5" fill="#818cf8" opacity="0.6"/>
  <circle cx="256" cy="120" r="5" fill="#818cf8" opacity="1"/> <!-- Centro assoluto orizzontale -->
  <circle cx="316" cy="120" r="5" fill="#818cf8" opacity="0.6"/>
  <circle cx="376" cy="120" r="5" fill="#818cf8" opacity="0.6"/>

  <!-- Griglia dei giorni centrata millimetricamente (Matrix 5x3) -->
  <!-- Riga 1 (Y = 215) -->
  <rect x="115" y="215" width="42" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="175" y="215" width="42" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="235" y="215" width="42" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="295" y="215" width="42" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="355" y="215" width="42" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />

  <!-- Riga 2 (Y = 275) - Centro orizzontale e verticale -->
  <rect x="115" y="275" width="42" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="175" y="275" width="42" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />

  <!-- Giorno Selezionato / Target (Centro Assoluto a X=256, Y=296) -->
  <g filter="url(#glow)">
    <rect x="233" y="273" width="46" height="46" rx="12" fill="url(#accentGrad)" />
    <circle cx="256" cy="296" r="4" fill="#ffffff" />
  </g>

  <rect x="295" y="275" width="42" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="355" y="275" width="42" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />

  <!-- Riga 3 (Y = 335) -->
  <rect x="115" y="335" width="42" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="175" y="335" width="42" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="235" y="335" width="42" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="295" y="335" width="42" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <rect x="355" y="335" width="42" height="42" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />

</svg>
